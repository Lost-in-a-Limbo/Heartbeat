<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Fleet Monitor</title>
<style>
  :root {
    color-scheme: light;
    --paper: #FAFAF7;
    --ink: #1F2420;
    --soft: #6B736C;
    --rule: #E6E8E3;
    --hover: #F3F4EF;
    --green: #2F6B3A;
    --clay: #B5523B;
    --sans: -apple-system, "Segoe UI", Inter, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 56px 20px 64px;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 960px; }
  @media (min-width: 1040px) { main { margin-left: 64px; } }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .soft { color: var(--soft); }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  #updated { font-size: 12px; }

  .summary { margin: 28px 0 40px; font-size: 15px; color: var(--soft); }
  .summary strong { font-weight: 600; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
  .summary .online strong { color: var(--green); }
  .summary .offline strong { color: var(--clay); }
  .summary .sep { margin: 0 8px; }

  .controls {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 20px 32px; margin-bottom: 8px;
  }
  .filters { display: flex; gap: 24px; }
  .filters button {
    padding: 4px 0 6px; border: 0; border-bottom: 2px solid transparent; background: none;
    color: var(--soft); font: inherit; font-size: 14px; cursor: pointer;
  }
  .filters button:hover { color: var(--ink); }
  .filters button[aria-pressed="true"] { color: var(--green); border-bottom-color: var(--green); }

  form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
  input {
    width: 150px; padding: 6px 0; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0;
    background: transparent; color: var(--ink); font: inherit; font-size: 14px;
  }
  input[name="id"] { font-family: var(--mono); font-size: 13px; }
  input::placeholder { color: var(--soft); opacity: 0.7; }
  input:focus { outline: none; border-bottom-color: var(--green); }
  form button {
    padding: 6px 14px; border: 0; border-radius: 4px; background: var(--green); color: var(--paper);
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  form button:hover { background: #275A31; }

  :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 2px; }
  input:focus-visible { outline: none; border-bottom: 2px solid var(--green); padding-bottom: 5px; }

  .message { min-height: 22px; margin: 8px 0 24px; font-size: 13px; }
  .message.ok { color: var(--green); }
  .message.error { color: var(--clay); }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 20px 12px 0; text-align: left; white-space: nowrap; }
  th:last-child, td:last-child { padding-right: 0; }
  th {
    padding-bottom: 10px; border-bottom: 1px solid var(--rule);
    font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft);
  }
  td { border-bottom: 1px solid var(--rule); }
  th.num, td.num { text-align: right; }
  tbody tr:hover td { background: var(--hover); }
  tbody tr.empty-row:hover td { background: none; }

  .status { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .status.online { color: var(--green); }
  .status.online .dot { background: var(--green); }
  .status.offline { color: var(--clay); }
  .status.offline .dot { background: var(--clay); }
  .reported-error { color: var(--clay); }

  td.empty { padding: 32px 0; border-bottom: 0; color: var(--soft); white-space: normal; }

  footer { margin-top: 28px; font-size: 12px; color: var(--soft); }

  @media (max-width: 640px) {
    body { padding: 32px 16px 48px; }
    .summary { margin: 20px 0 28px; }
    .controls { flex-direction: column; align-items: stretch; }
    input { flex: 1 1 120px; width: auto; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .filters button, input, form button, tbody td { transition: color 120ms ease, border-color 120ms ease, background-color 120ms ease; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Device Fleet Monitor</h1>
    <span class="soft" id="updated">Connecting…</span>
  </header>

  <p class="summary" aria-label="Fleet summary" aria-live="polite">
    <span><strong id="total">—</strong> <span id="total-label">devices</span></span><span class="sep" aria-hidden="true">·</span><span class="online"><strong id="online">—</strong> online</span><span class="sep" aria-hidden="true">·</span><span class="offline"><strong id="offline">—</strong> offline</span>
  </p>

  <div class="controls">
    <div class="filters" role="group" aria-label="Filter by status">
      <button type="button" data-filter="" aria-pressed="true">All</button>
      <button type="button" data-filter="ONLINE" aria-pressed="false">Online</button>
      <button type="button" data-filter="OFFLINE" aria-pressed="false">Offline</button>
    </div>
    <form id="register">
      <input name="id" placeholder="device-06" required pattern="[A-Za-z0-9._\-]{1,64}" aria-label="Device id" autocomplete="off">
      <input name="name" placeholder="Name" required aria-label="Device name" autocomplete="off">
      <button type="submit">Register</button>
    </form>
  </div>
  <p class="message" id="message" role="status"></p>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>Device</th><th>Name</th><th>Status</th><th>Last heartbeat</th>
          <th>Device clock</th><th>Reported</th><th class="num">CPU %</th><th class="num">Signal dBm</th>
          <th>Registered</th>
        </tr>
      </thead>
      <tbody id="devices"></tbody>
    </table>
  </div>
  <footer>Status is derived by the server on every read. This page refreshes every 2 seconds.</footer>
</main>

<script>
  const POLL_MS = 2000;
  const MISSING = "—";
  let filter = "";

  const $ = (id) => document.getElementById(id);

  function cell(content, className, title) {
    const td = document.createElement("td");
    if (className) td.className = className;
    if (title) td.title = title;
    if (content instanceof Node) td.append(content);
    else td.textContent = content ?? MISSING;
    return td;
  }

  function statusMark(status) {
    const span = document.createElement("span");
    span.className = "status " + status.toLowerCase();
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.setAttribute("aria-hidden", "true");
    span.append(dot, status.toLowerCase());
    return span;
  }

  function ago(iso) {
    if (!iso) return "never";
    const seconds = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
    if (seconds < 60) return seconds + "s ago";
    if (seconds < 3600) return Math.floor(seconds / 60) + "m " + (seconds % 60) + "s ago";
    return new Date(iso).toLocaleString();
  }

  function time(iso) {
    return iso ? new Date(iso).toLocaleTimeString() : MISSING;
  }

  async function getJson(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error(path + " returned HTTP " + res.status);
    return res.json();
  }

  function renderRows(devices) {
    const body = $("devices");
    body.replaceChildren();
    if (devices.length === 0) {
      const td = cell(filter ? "No " + filter.toLowerCase() + " devices." : "No devices registered yet. Start the simulator or register one above.", "empty");
      td.colSpan = 9;
      const tr = document.createElement("tr");
      tr.className = "empty-row";
      tr.append(td);
      body.append(tr);
      return;
    }
    for (const d of devices) {
      const m = d.metrics || {};
      const tr = document.createElement("tr");
      tr.append(
        cell(d.id, "mono"),
        cell(d.name),
        cell(statusMark(d.status)),
        cell(ago(d.last_heartbeat), "mono", d.last_heartbeat),
        cell(time(d.last_reported_timestamp), "mono soft", d.last_reported_timestamp),
        cell(m.status ? m.status.toLowerCase() : MISSING, m.status === "ERROR" ? "reported-error" : "soft"),
        cell(m.cpu_usage, "mono num"),
        cell(m.signal_strength, "mono num"),
        cell(time(d.registered_at), "mono soft", d.registered_at),
      );
      body.append(tr);
    }
  }

  async function refresh() {
    try {
      const query = filter ? "?status=" + filter : "";
      const [summary, list] = await Promise.all([getJson("/summary"), getJson("/devices" + query)]);
      const details = await Promise.all(
        list.map((d) => getJson("/devices/" + encodeURIComponent(d.id)).catch(() => d)),
      );
      $("total").textContent = summary.total;
      $("total-label").textContent = summary.total === 1 ? "device" : "devices";
      $("online").textContent = summary.online;
      $("offline").textContent = summary.offline;
      renderRows(details);
      $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (error) {
      $("updated").textContent = "Cannot reach server: " + error.message;
    }
  }

  function showMessage(text, kind) {
    const el = $("message");
    el.textContent = text;
    el.className = "message " + kind;
  }

  document.querySelectorAll("[data-filter]").forEach((button) => {
    button.addEventListener("click", () => {
      filter = button.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
      refresh();
    });
  });

  $("register").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.target;
    const body = { id: form.elements.id.value.trim(), name: form.elements.name.value.trim() };
    try {
      const res = await fetch("/devices", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        showMessage(data.error ? data.error.message : "HTTP " + res.status, "error");
        return;
      }
      showMessage("Registered " + data.id + ". It stays offline until its first heartbeat.", "ok");
      form.reset();
      refresh();
    } catch (error) {
      showMessage("Request failed: " + error.message, "error");
    }
  });

  refresh();
  setInterval(refresh, POLL_MS);
</script>
</body>
</html>
